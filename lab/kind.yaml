# kind cluster of the demo profile. One control-plane + two workers: enough to
# exercise scheduling and NetworkPolicies (kindnet enforces them since kind
# v0.24) without wasting laptop resources. Pattern from Argo-cd-Labs lab/kind.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ct
nodes:
  - role: control-plane
    image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx: every UI and the use-case API answer on *.localhost:8088
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
        listenAddress: "127.0.0.1"
  - role: worker
    image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
  - role: worker
    image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48

# ============================================================================
# TEMPLATE — Application of a workload. The link with its manifests.
#
# Usage: copy to `gitops/environments/demo/apps/<name>.yaml`, replace the markers and add
#        the file to `gitops/environments/demo/apps/kustomization.yaml` — or let
#        `scripts/repo/register-workload.py` do it.
#
#   NAME        same as in the AppProject and the namespace.
#   REPO_URL    same exact URL as in `sourceRepos` of the AppProject.
#   PATH        directory with the manifests (a Helm chart or plain YAML),
#               e.g. workloads/minio or use-cases/listing-engine/workloads/api
#   ARCHETYPE   stateless | batch | stateful | pipeline   (docs/design/archetypes.md)
#
# Inherited from teo-devops/Argo-cd-Labs.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: NAME
  namespace: argocd
  annotations:
    mlops-ct-platform.dev/archetype: ARCHETYPE
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The AppProject is the boundary. Never `default`: it restricts nothing.
  project: NAME

  source:
    repoURL: 'REPO_URL'
    targetRevision: main
    path: PATH
    # For a Helm chart the demo profile is values.yaml + values-demo.yaml.
    # Other profiles (prod, aws) only swap this list.
    helm:
      valueFiles:
        - values.yaml
        - values-demo.yaml

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: NAME

  syncPolicy:
    automated:
      # selfHeal from day one: reverts any `kubectl edit`.
      # On a `batch` workload it means DELETING A FINISHED JOB RE-RUNS IT.
      selfHeal: true
      # prune NO at birth: while the workload stabilises, a short render must
      # not delete live resources. Enabling it is a one-line PR. When enabled,
      # resources that must never die (PVCs) carry
      # `argocd.argoproj.io/sync-options: Prune=false` in the chart.
      prune: false
    syncOptions:
      # Argo CD creates the destination namespace; the chart declares none.
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/managed-by: argocd
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

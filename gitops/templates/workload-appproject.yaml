# ============================================================================
# TEMPLATE — AppProject of a workload. The boundary.
#
# Usage: copy to `gitops/environments/demo/projects/<name>.yaml`, replace the markers and
#        add the file to `gitops/environments/demo/projects/kustomization.yaml` — or let
#        `scripts/repo/register-workload.py` do it.
#
#   NAME         workload name = AppProject name = namespace = file name.
#                All four equal; scripts/repo/validate-coherence.py checks it.
#   REPO_URL     exact Git URL of the repository holding the manifests.
#   DESCRIPTION  one line: what it is and which components it groups.
#   TEAM         identity-provider group that operates it in the Argo CD UI.
#
# This template is NEUTRAL: it serves an API, a training pipeline, a shared
# service or an internal tool alike. What changes between archetypes lives in
# the workload directory, not here.
#
# THIS FILE IS WRITTEN AND REVIEWED BY HAND, always. It defines privilege
# limits; generating it would void the control it exercises.
#
# Inherited from teo-devops/Argo-cd-Labs.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: NAME
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: DESCRIPTION

  # --- 1. Which repository it may read from --------------------------------
  # One. In this monorepo every workload reads the platform repository; the
  # isolation is the destination namespace below. With one repo per workload
  # (the original model) this is that workload's repository.
  sourceRepos:
    - 'REPO_URL'

  # --- 2. Where it may write -----------------------------------------------
  # One exact namespace, no wildcard. A manifest declaring another namespace
  # fails the WHOLE sync; nothing deploys partially.
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: NAME

  # --- 3. Cluster-scoped resources: ONLY Namespace -------------------------
  # `Namespace` is MANDATORY: `CreateNamespace=true` does not bypass this list
  # (the namespace is created as a PreSync task and validated against the
  # project), so without this entry the FIRST SYNC FAILS.
  # Any ADDITIONAL entry opens permissions nobody asked for; the validator
  # rejects it. A CRD or a ClusterRole means the resource belongs to a
  # platform module, not to a workload.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  # --- 4. Namespaced resources the workload may NOT touch ------------------
  # Only RBAC: a workload does not grant API permissions to itself. RBAC that a
  # workload legitimately needs (e.g. the ServiceAccount running its
  # pipelines) is provided by the platform module that owns that capability —
  # see gitops/environments/demo/platform/argo-workflows.
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

  # --- 5. Who operates it in the Argo CD UI --------------------------------
  # INACTIVE until an OIDC provider emits the `groups` claim (dex is off in the
  # demo). Bind a local account to this role from policy.csv to grant access
  # without SSO.
  roles:
    - name: developer
      description: Sync and read on the Applications of NAME
      policies:
        - p, proj:NAME:developer, applications, get, NAME/*, allow
        - p, proj:NAME:developer, applications, sync, NAME/*, allow
        - p, proj:NAME:developer, logs, get, NAME/*, allow
      groups:
        - TEAM

  # Warn (never delete) about resources living in the namespace that are not
  # declared in Git — the detector of clandestine `kubectl`.
  orphanedResources:
    warn: true

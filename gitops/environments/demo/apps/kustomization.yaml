apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# One Application per workload, grouped by owner:
#   shared/          platform-wide workloads (artifact store, alerting rules)
#   <use-case>/      the workloads of one use case
# Registering a workload = one file in its group and one line in the group's
# kustomization.yaml (scripts/register-workload.py does both). A new group =
# a directory with its own kustomization.yaml plus one line here.
#
# Plain Applications instead of an ApplicationSet, on purpose: workloads are
# heterogeneous and an ApplicationSet generates Applications but NOT
# AppProjects — it would automate the harmless half of the registration and
# leave the dangerous half by hand. See docs/decisions.md.
resources:
  - listing-engine
  - shared

# Wave 5: after every platform module.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "5"

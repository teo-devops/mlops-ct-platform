# strimzi — demo profile. OPT-IN module (docs/modules/strimzi.md).
#
# Contract implemented: "event-bus" (docs/design/contracts.md): the prediction
# records of every use-case API on topic `predictions`, consumed by the drift
# monitor (`ctsteps drift --source kafka`). This chart installs the Cluster
# Operator and the CRDs only; the cluster itself is manifests/kafka.yaml.
#
# The operator watches its own namespace (`kafka`): the platform owns the
# brokers and the topics, a use case only publishes and consumes.
watchNamespaces: []
watchAnyNamespace: false

resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 512Mi}

# The chart's dashboards expect the JMX exporter's metric names; the cluster
# uses the Strimzi Metrics Reporter (manifests/kafka.yaml). Off.
dashboards:
  enabled: false

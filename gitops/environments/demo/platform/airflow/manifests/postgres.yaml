# Metadata database of Airflow: a single Postgres, official image pinned by
# tag, on a PVC that is never pruned. Credentials out of band (Secret
# airflow-postgres, scripts/platform/03-secrets.sh). The prod profile uses a
# managed Postgres and this file disappears.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-postgres-data
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-postgres
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow-postgres
    app.kubernetes.io/part-of: airflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-postgres
        app.kubernetes.io/part-of: airflow
    spec:
      securityContext:
        fsGroup: 70          # postgres group of the alpine image
      containers:
        - name: postgres
          image: postgres:16.10-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: airflow-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airflow-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow-postgres
spec:
  selector:
    app.kubernetes.io/name: airflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

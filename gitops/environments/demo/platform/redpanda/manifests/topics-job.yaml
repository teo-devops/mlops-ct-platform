# The topics of the event-bus contract, provisioned after every sync (a Job is
# immutable: recreated each time, idempotent commands). Same pattern as the
# MinIO setup Job for buckets: the platform owns the topic list, a use case
# publishes to `predictions` and reads it back; it never creates topics.
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topics
  namespace: redpanda
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
          command: [sh, -ec]
          args:
            - |
              export RPK_BROKERS=redpanda.redpanda.svc.cluster.local:9093
              for t in predictions; do
                if rpk topic describe "$t" >/dev/null 2>&1; then echo "topic $t exists"
                else rpk topic create "$t" -p 3 -r 1 -c retention.ms=604800000; fi
              done
              rpk topic list
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}

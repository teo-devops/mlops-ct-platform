# redpanda — demo profile. OPT-IN module (docs/modules/event-bus.md).
#
# Contract implemented: "event-bus" (docs/design/contracts.md#event-bus): the
# prediction records of every use-case API on a Kafka topic, consumed by the
# drift monitor (`ctsteps drift --source kafka`) and by whatever comes next
# (shadow models, label joins). Kafka protocol without JVM, ZooKeeper/KRaft
# quorum or operator: one pod on kind. The prod profile is Kafka via Strimzi
# (same clients, other bootstrap URL) — see the module card.
#
# No TLS, no SASL: internal listener only, reachable solely from the
# namespaces whose NetworkPolicies allow port 9093 (the use case's api and
# pipelines). Nothing secret, nothing out of band.
image:
  tag: v26.2.2

statefulset:
  replicas: 1

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1.5Gi

storage:
  persistentVolume:
    enabled: true
    size: 5Gi

tls:
  enabled: false
auth:
  sasl:
    enabled: false
external:
  enabled: false

# kind: no kernel tuning; the chart's RBAC stays (its sidecar watches its own
# Secrets/ConfigMaps), minus the debug-bundle role
tuning:
  tune_aio_events: false
rbac:
  enabled: true
  rpkDebugBundle: false

monitoring:
  enabled: true          # ServiceMonitor for kube-prometheus-stack
  scrapeInterval: 30s

config:
  cluster:
    auto_create_topics_enabled: false   # topics are provisioned (manifests/topics-job.yaml)
    default_topic_replications: 1
    log_retention_ms: 604800000         # 7 days: the monitor's windows are minutes

console:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: redpanda.localhost
        paths:
          - path: /
            pathType: Prefix

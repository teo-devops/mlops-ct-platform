# PLATFORM AppProject. The only one with cluster-scoped permissions.
# It owns the GitOps engine and every platform module (cert-manager, KServe,
# MLflow, Argo Workflows, monitoring): everything that brings CRDs, webhooks,
# ClusterRoles or runtime RBAC for the workloads.
#
# No workload uses this project. If a workload needed something from here,
# that resource belongs to a platform module, not to the workload.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Shared infrastructure of the cluster — engine and platform modules

  sourceRepos:
    - 'https://github.com/teo-devops/mlops-ct-platform.git'
    # Upstream charts used by the platform modules. Adding a module that pulls
    # a new chart repository = adding it here AND in gitops/argo-cd/values.yaml.
    - 'https://argoproj.github.io/argo-helm'
    - 'https://charts.jetstack.io'
    - 'ghcr.io/kserve/charts'
    - 'https://community-charts.github.io/helm-charts'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://github.com/kubernetes-sigs/gateway-api.git'

  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: '*'

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: true
    # Objects that legitimately exist without being in Git; excluding them
    # keeps the orphan warning meaningful.
    ignore:
      # Repository credentials, one per repo. They cannot be in Git: Argo CD
      # needs them to clone the repo that would contain them.
      - group: ''
        kind: Secret
        name: repo-*
      # Generated by argocd-server on first start, not by the chart.
      - group: ''
        kind: Secret
        name: argocd-initial-admin-secret
      # Demo credentials created by scripts/15-demo-secrets.sh before the
      # first sync (docs/secrets.md). Never declared in Git.
      - group: ''
        kind: Secret
        name: demo-*

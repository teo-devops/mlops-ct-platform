# ============================================================================
# Values for the argo-cd chart (argoproj/argo-helm).
#
# SINGLE source of Argo CD configuration, consumed by two actors:
#   1. scripts/install.sh — via `helm template -f`, once, when Argo CD does not
#      exist yet.
#   2. Argo CD itself — via the multi-source Application in
#      gitops/environments/demo/argo-cd.yaml, which references this file as
#      `$values/gitops/argo-cd/values.yaml`.
#
# Inherited from teo-devops/Argo-cd-Labs with three changes for this platform:
#   - Application health check (Lua) so that sync-waves between Applications
#     actually order the platform modules.
#   - Declarative Helm repositories (OCI for KServe).
#   - Dex disabled: the demo has no SSO. RBAC is kept so that it can be
#     switched on without touching anything else.
# ============================================================================

# Canonical object names (`argocd-server`, `argocd-repo-server`...) instead of
# `<release>-argocd-*`, so every upstream runbook and the `argocd` CLI apply.
fullnameOverride: argocd

crds:
  install: true
  # Never delete the CRDs on uninstall: every Application and AppProject in
  # the cluster would vanish with them.
  keep: true
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
    argocd.argoproj.io/sync-wave: "-2"

global:
  # UI hostname. The demo publishes every UI on `<service>.localhost:8088`
  # through ingress-nginx (cluster/kind.yaml maps 80 -> 8088). Browsers resolve
  # *.localhost to 127.0.0.1 without any DNS.
  domain: argocd.localhost

configs:
  cm:
    # Exact public URL: Argo CD builds redirects with it. HTTP on purpose.
    url: http://argocd.localhost:8088

    # Warn in the UI about resources present in the cluster that nobody declares.
    application.resourceTrackingMethod: annotation

    # --------------------------------------------------------------------
    # Application health = health of the Applications it owns.
    #
    # By default Argo CD does NOT assess the health of `Application`
    # resources, so an app-of-apps considers a child "Healthy" the moment it
    # exists, and sync-waves between children order nothing. With this
    # check the root-app waits for wave N to be Healthy before wave N+1:
    # cert-manager before KServe, the KServe CRDs before the InferenceServices.
    # --------------------------------------------------------------------
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # Ignore the CA bundles that cert-manager injects into webhooks: they
    # are legitimately mutated in the cluster and would show OutOfSync forever.
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'

  params:
    # Minimum wait between self-heal attempts on the same Application.
    controller.self.heal.timeout.seconds: 5
    # argocd-server speaks plain HTTP; the ingress talks to the browser.
    server.insecure: true

  # Helm repositories the platform modules pull charts from. Declared here so
  # that a fresh cluster knows them without any `argocd repo add`. Public,
  # anonymous: no credentials. The Git credential of this repository (private
  # until published) is NOT here: install.sh phase 0 creates it in-cluster.
  repositories:
    kserve-charts:
      type: helm
      name: kserve
      url: ghcr.io/kserve/charts
      enableOCI: "true"
    jetstack:
      type: helm
      name: jetstack
      url: https://charts.jetstack.io
    prometheus-community:
      type: helm
      name: prometheus-community
      url: https://prometheus-community.github.io/helm-charts
    community-charts:
      type: helm
      name: community-charts
      url: https://community-charts.github.io/helm-charts
    argo-helm:
      type: helm
      name: argo
      url: https://argoproj.github.io/argo-helm

  # ==========================================================================
  # RBAC — designed to grow from "admin only" to several users without redoing
  # it. Roles are defined once; adding people is adding a `g,` line, whether
  # the subject is a local account or an OIDC group.
  # ==========================================================================
  rbac:
    create: true
    # EMPTY on purpose. `policy.default` applies to EVERY authenticated user
    # and cannot be narrowed later with `deny` rules. Empty = no explicit role,
    # nothing visible. The `admin` account is not affected.
    policy.default: ''
    scopes: "[groups]"
    policy.csv: |
      # --- Platform roles -----------------------------------------------------
      p, role:platform, applications, *, */*, allow
      p, role:platform, projects, get, *, allow
      p, role:platform, repositories, *, *, allow
      p, role:platform, clusters, get, *, allow
      p, role:platform, logs, get, */*, allow
      p, role:platform, exec, create, */*, deny

      p, role:observer, applications, get, */*, allow
      p, role:observer, projects, get, *, allow
      p, role:observer, logs, get, */*, allow

      # --- Who holds each role ------------------------------------------------
      # Local accounts (configs.cm.accounts.*) or OIDC groups once Dex is on:
      #   g, alice, role:platform
      #   g, my-org/data-science, proj:listing-engine-pipelines:developer

  secret:
    # The chart generates `argocd-secret` with the admin password.
    createSecret: true

## --- Topology -------------------------------------------------------------
# Single logical node. For HA: controller.replicas 2, redis-ha.enabled true
# (3+ nodes), server/repoServer replicas 2. See gitops/environments/prod.
controller:
  replicas: 1
  metrics:
    enabled: true

redis-ha:
  enabled: false

server:
  replicas: 1
  metrics:
    enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    # Empty hostname inherits global.domain.
    hostname: ""
    path: /
    pathType: Prefix
    tls: false

repoServer:
  replicas: 1
  metrics:
    enabled: true

applicationSet:
  enabled: true

# Dex is the embedded OIDC provider. Off: the demo has no SSO. Turning it on
# is `enabled: true` plus a `dex.config` connector under configs.cm.
dex:
  enabled: false

notifications:
  enabled: false

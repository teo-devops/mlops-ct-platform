apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# ============================================================================
# Bootstrap PHASE 3 — switch the reconciler on.
#
# Applied by scripts/install.sh after phase 2 has waited for the Argo CD CRDs
# to be Established. Do not apply this on its own: without that wait, creating
# an Application is a race against the apiserver.
#
# The AppProjects are seeded here because root-app declares `project: platform`
# and an Application whose project does not exist stays in permanent error.
# As soon as root-app syncs it takes ownership of these same objects through
# gitops/environments/demo — the bootstrap only creates them early.
# ============================================================================
resources:
  - ../environments/demo/projects
  - root-app.yaml

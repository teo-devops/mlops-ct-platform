# Python packages: lint, tests (steps against a fake S3 + local MLflow, API against mocked
# models) and the images build. Blocking. The GitOps tree is validated by validate.yaml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --quiet -e "libs/ctsteps[dev]" -e "libs/ctserve[dev]" \
            $(for d in use-cases/*/plugin use-cases/*/api; do [ -f "$d/pyproject.toml" ] && printf -- '-e %s[dev] ' "$d"; done)
      - name: Lint
        run: ruff check libs use-cases orchestrators && ruff format --check libs use-cases orchestrators
      - name: Test ctsteps (whole pipeline against moto + sqlite MLflow)
        run: cd libs/ctsteps && MLFLOW_DISABLE_AGENT_HINT=1 pytest -q
      - name: Test ctserve
        run: cd libs/ctserve && pytest -q
      - name: Test every use case (plugin on the step harness, API)
        run: |
          for d in use-cases/*/plugin use-cases/*/api; do
            [ -f "$d/pyproject.toml" ] || continue
            echo "== $d"; (cd "$d" && MLFLOW_DISABLE_AGENT_HINT=1 pytest -q)
          done

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: ctsteps-base
        run: docker build -t ctsteps-base:ci libs/ctsteps
      - name: ctserve-base
        run: docker build -t ctserve-base:ci libs/ctserve
      - name: Every use case's images run as non-root and the CLI answers
        run: |
          for uc in use-cases/*/; do
            uc="${uc%/}"; name="$(basename "$uc")"
            docker build --build-arg BASE=ctsteps-base:ci -t "$name-steps:ci" "$uc/plugin"
            [ "$(docker run --rm "$name-steps:ci" id -u)" = "10001" ]
            docker run --rm "$name-steps:ci" ctsteps --help | grep -q drift
            if [ -d "$uc/api" ]; then
              docker build --build-arg BASE=ctserve-base:ci -t "$name-api:ci" "$uc/api"
              [ "$(docker run --rm "$name-api:ci" id -u)" = "10001" ]
            fi
          done

[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ctserve"
version = "0.1.0"
description = "Serving-side contract of the platform for use-case APIs: metrics, prediction log, event bus, circuit breaker."
requires-python = ">=3.12"
dependencies = [
  "prometheus-client==0.26.0",
  "structlog==26.1.0",
  "boto3==1.43.103",
  "confluent-kafka==2.15.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

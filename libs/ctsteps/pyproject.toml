[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ctsteps"
version = "0.1.0"
description = "Continuous-training pipeline steps as containers: an orchestrator-agnostic contract."
requires-python = ">=3.11"
dependencies = [
  # Exactly what kserve/sklearnserver:v0.20.0 pins: a model pickled here must
  # unpickle there.
  "scikit-learn==1.5.2",
  "joblib==1.5.3",
  "numpy==2.4.4",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "pyarrow==25.0.1",
  "mlflow==3.16.1",
  "boto3==1.43.103",
  "evidently==0.7.23",
  "prometheus-client==0.26.0",
  "kubernetes==36.0.3",
  "pyyaml==6.0.3",
  "confluent-kafka==2.15.1",   # event-bus source of the drift monitor
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "moto[s3]==5.2.3", "ruff==0.16.8"]

[project.scripts]
ctsteps = "ctsteps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.name" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api.name" . }}
  template:
    {{- include "api.podTemplate" . | nindent 4 }}
{{- else }}
# Progressive delivery (opt-in argo-rollouts platform module, docs/modules/progressive-delivery.md):
# the same pod template as a Rollout. ingress-nginx splits traffic between the
# stable and the canary Service by weight; between steps the platform's
# ClusterAnalysisTemplate judges the canary pods on the SLO series; a failed
# analysis aborts and traffic returns to the stable ReplicaSet.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "api.name" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api.name" . }}
  template:
    {{- include "api.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      stableService: {{ include "api.name" . }}
      canaryService: {{ include "api.name" . }}-canary
      trafficRouting:
        nginx:
          stableIngress: {{ include "api.name" . }}
      steps:
        {{- range .Values.rollout.steps }}
        {{- if eq (toString .) "analysis" }}
        - analysis:
            templates:
              - templateName: {{ $.Values.rollout.analysisTemplate }}
                clusterScope: true
            args:
              - name: use-case
                value: {{ .Values.useCase }}
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.name" . }}-canary
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "api.name" . }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api.name" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.name" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "api.name" . }}
  ports:
    - name: http
      port: 80
      targetPort: http

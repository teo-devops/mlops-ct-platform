[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "__UC__"
version = "0.1.0"
description = "__UC_TITLE__ use case: a ctsteps plugin."
requires-python = ">=3.11"
dependencies = ["ctsteps"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8", "moto[s3]==5.2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

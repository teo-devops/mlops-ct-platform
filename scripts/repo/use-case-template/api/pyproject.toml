[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "__UC__-api"
version = "0.1.0"
description = "__UC_TITLE__ API: one request in, every model's prediction out, with lineage."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "prometheus-fastapi-instrumentator==8.1.0",
  "structlog==26.1.0",
  "ctserve",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx==0.23.1", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automated-listing-engine-api
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: automated-listing-engine-api
  template:
    {{- include "api.podTemplate" . | nindent 4 }}
{{- else }}
# Progressive delivery (opt-in argo-rollouts platform module, docs/modules/progressive-delivery.md):
# the same pod template as a Rollout. ingress-nginx splits traffic between the
# stable and the canary Service by weight; between steps the platform's
# ClusterAnalysisTemplate judges the canary pods on the SLO series; a failed
# analysis aborts and traffic returns to the stable ReplicaSet.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: automated-listing-engine-api
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: automated-listing-engine-api
  template:
    {{- include "api.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      stableService: automated-listing-engine-api
      canaryService: automated-listing-engine-api-canary
      trafficRouting:
        nginx:
          stableIngress: automated-listing-engine-api
      steps:
        {{- range .Values.rollout.steps }}
        {{- if eq (toString .) "analysis" }}
        - analysis:
            templates:
              - templateName: {{ $.Values.rollout.analysisTemplate }}
                clusterScope: true
            args:
              - name: use-case
                value: automated-listing-engine
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: automated-listing-engine-api-canary
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: automated-listing-engine-api
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: automated-listing-engine-api
  labels:
    {{- include "api.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: automated-listing-engine-api
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: automated-listing-engine-api
  ports:
    - name: http
      port: 80
      targetPort: http

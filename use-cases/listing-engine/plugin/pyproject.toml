[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-engine"
version = "0.1.0"
description = "Listing Engine use case: categorise a marketplace listing and flag fraud. A ctsteps plugin."
requires-python = ">=3.11"
dependencies = ["ctsteps"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

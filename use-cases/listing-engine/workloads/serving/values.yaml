useCase: listing-engine

# Serving contract: each model is an InferenceService whose storageUri points
# at `s3://<bucket>/<use_case>/<model>/v<version>` (one model.joblib inside).
# `version` is what the pipeline's promote step bumps — the deployment IS
# this commit. Version "0" means "nothing published yet": the predictor stays
# Progressing until the first pipeline run promotes v1.
artifactStore:
  bucket: models
  # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of the `models-reader`
  # user, created by scripts/platform/03-secrets.sh (never in Git). Endpoint,
  # region and scheme are the cluster-wide defaults of the KServe module.
  secretName: models-s3-credentials

models:
  categorizer:
    version: "0"
    minReplicas: 1
    maxReplicas: 1
  fraud:
    version: "0"
    minReplicas: 1
    maxReplicas: 1

runtime:
  modelFormat: sklearn
  protocolVersion: v1
  predictProba: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  # kind has no metrics-server: no HPA. The prod profile sets `hpa`.
  autoscalerClass: external

podMonitor:
  enabled: true

networkPolicy:
  enabled: true
  apiNamespace: listing-engine-api
  observabilityNamespace: observability
  artifactStoreNamespace: minio

# KServe's storage-initializer reads S3 credentials from the Secrets listed in
# the predictor's ServiceAccount. The Secret (`models-s3-credentials`) is
# created out of band by scripts/platform/secrets.sh and never declared in
# Git; the S3 endpoint, region and scheme are cluster-wide defaults of the
# KServe platform module (gitops/environments/demo/platform/kserve/values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: models-reader
  labels:
    {{- include "serving.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.artifactStore.secretName }}

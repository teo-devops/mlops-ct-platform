apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.name" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  # --- platform contract read by ctserve (docs/design/contracts.md) ---------
  CT_USE_CASE_NAME: {{ .Values.useCase }}
  # one predictor per declared model (serving contract) and the version served
  # (lineage) — `ctserve.models_from_env()` turns these into ModelEndpoints
  {{- range $name, $m := .Values.models }}
  CT_MODEL_{{ $name | replace "-" "_" | upper }}_URL: http://{{ $name }}-predictor.{{ $.Values.serving.namespace }}.svc.cluster.local/v1/models/{{ $name }}:predict
  CT_MODEL_{{ $name | replace "-" "_" | upper }}_VERSION: {{ $m.version | quote }}
  {{- end }}
  CT_PREDICTION_LOG_ENABLED: {{ .Values.predictionLog.enabled | quote }}
  CT_PREDICTIONS_BUCKET: {{ .Values.predictionLog.bucket }}
  S3_ENDPOINT_URL: {{ .Values.predictionLog.s3EndpointUrl }}
  AWS_DEFAULT_REGION: us-east-1
  {{- if .Values.eventBus.enabled }}
  CT_EVENT_BUS_BOOTSTRAP: {{ .Values.eventBus.bootstrap }}
  CT_EVENT_BUS_TOPIC: {{ .Values.eventBus.topic }}
  {{- end }}
  # --- the use case's own settings (values: extraEnv) -----------------------
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}

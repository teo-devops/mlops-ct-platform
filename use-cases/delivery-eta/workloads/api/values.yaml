useCase: delivery-eta
image:
  repository: delivery-eta-api
  tag: 0.1.0
  pullPolicy: IfNotPresent
replicas: 1

# --- the serving contract this API consumes ---------------------------------
serving:
  namespace: delivery-eta-serving

# The use case's own settings, passed to its API as environment (any names).
extraEnv:
  DELIVERY_ETA_MODEL_TIMEOUT: "0.8"

# The versions currently served, for lineage. The pipeline's promote step
# bumps `models.<model>.version` here AND in ../serving/values-<profile>.yaml
# in the same commit: one commit = one release, API and predictor together.
models:
  eta:
    version: "0"

predictionLog:
  enabled: true
  bucket: delivery-eta-predictions   # this use case's bucket (isolation)
  s3EndpointUrl: http://seaweedfs.seaweedfs.svc.cluster.local:9000
  # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of the `api-writer` user
  secretName: api-s3-credentials

# Event bus (opt-in platform module `redpanda`, docs/modules/event-bus.md): the
# same prediction records published to a topic next to the S3 log. Off unless
# the module is enabled; then flip `enabled` here (values-<profile>.yaml).
eventBus:
  enabled: false
  bootstrap: redpanda.redpanda.svc.cluster.local:9093
  topic: predictions
  namespace: redpanda
  port: 9093

# Progressive delivery (opt-in platform module `argo-rollouts`,
# docs/modules/progressive-delivery.md): render a Rollout instead of the
# Deployment. Requires `ingress.enabled` (nginx canary weights on it). The
# `analysis` step runs the platform's ClusterAnalysisTemplate on this use case.
rollout:
  enabled: false
  analysisTemplate: ct-slo
  steps:
    - setWeight: 20
    - pause: {duration: 30s}   # let the canary receive traffic and be scraped
    - analysis
    - setWeight: 50
    - pause: {duration: 30s}

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

ingress:
  enabled: false
  className: nginx
  host: delivery-eta.localhost

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  observabilityNamespace: observability
  artifactStoreNamespace: seaweedfs

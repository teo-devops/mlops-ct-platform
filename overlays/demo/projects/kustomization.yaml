apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# One AppProject per workload. Adding a line here is the explicit act of
# granting a workload existence in the cluster. AppProjects are written and
# reviewed by hand: they define privilege boundaries.
resources:
  - platform.yaml
  - minio.yaml
  - observability.yaml

# AppProjects are created before the Applications that reference them: an
# Application whose project does not exist stays in permanent error.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

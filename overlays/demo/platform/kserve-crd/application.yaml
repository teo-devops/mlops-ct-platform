# Platform module: kserve-crd — see docs/modules/kserve-crd.md
# Upstream chart + values from this repository ($values). Pinned version.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-crd
      targetRevision: v0.20.0
      helm:
        releaseName: kserve-crd
        valueFiles:
          - $values/overlays/demo/platform/kserve-crd/values.yaml
    - repoURL: 'https://github.com/teo-devops/mlops-ct-platform.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kserve
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

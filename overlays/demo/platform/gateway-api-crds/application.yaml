# Platform module: gateway-api-crds — see docs/modules/gateway-api-crds.md
# Safety net: the KServe v0.20 controller registers the Gateway API types in
# its scheme even with `enableGatewayApi: false`. Installing the standard CRDs
# removes a whole class of "no matches for kind HTTPRoute" failures at zero
# cost, and is what a Gateway-based ingress (prod profile) needs anyway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: 'https://github.com/kubernetes-sigs/gateway-api.git'
    targetRevision: v1.5.1
    path: config/crd/standard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gateway-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# One Application per workload. Registering a new workload = one file here and
# one line below. The neutral templates live in templates/; the files here are
# real workloads of this platform, not templates.
#
# Plain Applications instead of an ApplicationSet, on purpose: workloads are
# heterogeneous (a Helm chart, plain YAML, a pipeline chart) and an
# ApplicationSet generates Applications but NOT AppProjects — it would
# automate the harmless half of the registration and leave the dangerous half
# by hand. See docs/decisions.md.
resources:
  - listing-engine-api.yaml
  - listing-engine-pipelines.yaml
  - listing-engine-serving.yaml
  - minio.yaml
  - observability.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "5"

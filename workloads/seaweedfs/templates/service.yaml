apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 23646
      targetPort: console
    # The setup Job's `weed shell` (inside the namespace only, see networkpolicy.yaml).
    - name: master
      port: 9333
      targetPort: master
    - name: master-grpc
      port: 19333
      targetPort: master-grpc

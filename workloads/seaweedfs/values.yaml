# Defaults shared by every profile. Profile-specific overrides live in
# values-<profile>.yaml (demo, prod, aws).
image:
  repository: docker.io/chrislusf/seaweedfs
  tag: "4.47"
  digest: sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882

# Secrets are NEVER in Git. scripts/platform/03-secrets.sh creates them before the
# first sync (docs/design/secrets.md):
#   rootSecret:  SEAWEEDFS_ROOT_USER / SEAWEEDFS_ROOT_PASSWORD (S3 admin identity
#                and the admin console login)
#   usersSecret: <ENVPREFIX>_SECRET_KEY for each user below (access key = user name)
rootSecret: seaweedfs-root
usersSecret: seaweedfs-users

persistence:
  size: 10Gi
  storageClassName: ""

# One `weed server` (master + volume + filer + S3 gateway) in one pod. Volumes are
# small so that a few-GiB PVC can host one collection per bucket.
storage:
  volumeSizeLimitMB: 256
  maxVolumes: 64

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# --- Buckets, users and rights: the artifact-store contract ----------------
# Every consumer gets its own user with the minimum bucket rights. Root
# credentials never leave this namespace.
#
# ISOLATION: a use case owns three buckets (<uc>-models, <uc>-datasets,
# <uc>-predictions) and three users (<uc>-reader, <uc>-pipeline, <uc>-api) whose
# rights name only its buckets (+ the shared `mlflow` bucket for the pipeline,
# which logs runs there). Another use case's keys get AccessDenied on them.
# `make new-use-case` appends these entries; scripts/repo/validate-coherence.py
# checks them. The layout inside a bucket stays <uc>/<model>/… (ctsteps).
#
# policy → SeaweedFS actions, per bucket: rw = Read+Write+List, ro = Read+List,
# wo = Write (templates/identities.yaml).
buckets:
  - mlflow        # MLflow artifacts (runs, logged models) — shared, written by the server
  # --- use case: automated-listing-engine
  - automated-listing-engine-models        # serving artifacts: <uc>/<model>/v<N>/model.joblib
  - automated-listing-engine-datasets      # pipeline datasets: raw, reference, holdout
  - automated-listing-engine-predictions   # prediction log written by the API (drift input)
  # --- use case: delivery-eta
  - delivery-eta-models
  - delivery-eta-datasets
  - delivery-eta-predictions

users:
  - name: mlflow          # the tracking server
    envPrefix: MLFLOW
    policy:
      rw: [mlflow]
  # --- use case: automated-listing-engine
  - name: automated-listing-engine-reader     # KServe storage-initializer
    envPrefix: AUTOMATED_LISTING_ENGINE_READER
    policy:
      ro: [automated-listing-engine-models]
  - name: automated-listing-engine-pipeline   # ctsteps (train, register, promote, drift)
    envPrefix: AUTOMATED_LISTING_ENGINE_PIPELINE
    policy:
      rw: [automated-listing-engine-models, automated-listing-engine-datasets, mlflow]
      ro: [automated-listing-engine-predictions]
  - name: automated-listing-engine-api        # prediction log
    envPrefix: AUTOMATED_LISTING_ENGINE_API
    policy:
      wo: [automated-listing-engine-predictions]
  # --- use case: delivery-eta
  - name: delivery-eta-reader
    envPrefix: DELIVERY_ETA_READER
    policy:
      ro: [delivery-eta-models]
  - name: delivery-eta-pipeline
    envPrefix: DELIVERY_ETA_PIPELINE
    policy:
      rw: [delivery-eta-models, delivery-eta-datasets, mlflow]
      ro: [delivery-eta-predictions]
  - name: delivery-eta-api
    envPrefix: DELIVERY_ETA_API
    policy:
      wo: [delivery-eta-predictions]

# Admin console (`weed admin`, login = root credentials). The filer UI is never
# exposed: it has no authentication and would bypass every right above.
ingress:
  enabled: false
  className: nginx
  consoleHost: seaweedfs.localhost

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the S3 API (9000). Keep in sync with the
  # consumers above.
  apiClients:
    - mlflow
    # --- use case: automated-listing-engine
    - automated-listing-engine-serving
    - automated-listing-engine-pipelines
    - automated-listing-engine-api
    # --- use case: delivery-eta
    - delivery-eta-serving
    - delivery-eta-pipelines
    - delivery-eta-api
  # Namespace of the ingress controller (console + host port-forward path).
  ingressNamespace: ingress-nginx
  observabilityNamespace: observability
  # CIDR of the kind docker network: NodePort/port-forward traffic from the
  # host enters with a node IP as source.
  hostCidr: 172.18.0.0/16

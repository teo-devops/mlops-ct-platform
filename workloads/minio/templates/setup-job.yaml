# Provisions buckets, users and policies — the artifact-store contract.
#
# Argo CD PostSync hook: it runs after every successful sync and is recreated
# each time (a Job is immutable). Every command is idempotent, so re-running
# it converges: new buckets/users in values.yaml appear, passwords rotated in
# the Secret are re-applied. Pattern from teo-devops/minIO-docker
# scripts/setup-buckets.sh + configs/policy.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-setup
  labels:
    {{- include "minio.labels" . | nindent 4 }}
data:
  setup.sh: |
    #!/bin/sh
    set -eu
    mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" --api S3v4
    {{- range .Values.buckets }}
    mc mb --ignore-existing local/{{ . }}
    {{- end }}
    {{- range .Values.users }}
    echo ">>> user {{ .name }}"
    # `user add` on an existing user updates its secret key: rotation-friendly.
    mc admin user add local "{{ .name }}" "${{ .envPrefix }}_SECRET_KEY"
    mc admin policy create local "{{ .name }}" /policies/{{ .name }}.json
    mc admin policy attach local "{{ .name }}" --user "{{ .name }}" 2>/dev/null || true
    {{- end }}
    echo "artifact store provisioned"
  {{- range .Values.users }}
  {{ .name }}.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {{- $stmts := list }}
        {{- with .policy.rw }}
        {{- $stmts = append $stmts (printf `{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":[%s]}` (join "," (regexReplaceAll "([^,]+)" (join "," .) `"arn:aws:s3:::${1}/*"` | splitList ","))) }}
        {{- $stmts = append $stmts (printf `{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":[%s]}` (join "," (regexReplaceAll "([^,]+)" (join "," .) `"arn:aws:s3:::${1}"` | splitList ","))) }}
        {{- end }}
        {{- with .policy.ro }}
        {{- $stmts = append $stmts (printf `{"Effect":"Allow","Action":["s3:GetObject"],"Resource":[%s]}` (join "," (regexReplaceAll "([^,]+)" (join "," .) `"arn:aws:s3:::${1}/*"` | splitList ","))) }}
        {{- $stmts = append $stmts (printf `{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":[%s]}` (join "," (regexReplaceAll "([^,]+)" (join "," .) `"arn:aws:s3:::${1}"` | splitList ","))) }}
        {{- end }}
        {{- with .policy.wo }}
        {{- $stmts = append $stmts (printf `{"Effect":"Allow","Action":["s3:PutObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":[%s]}` (join "," (regexReplaceAll "([^,]+)" (join "," .) `"arn:aws:s3:::${1}/*"` | splitList ","))) }}
        {{- $stmts = append $stmts (printf `{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":[%s]}` (join "," (regexReplaceAll "([^,]+)" (join "," .) `"arn:aws:s3:::${1}"` | splitList ","))) }}
        {{- end }}
        {{ join ",\n        " $stmts }}
      ]
    }
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
        {{- include "minio.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: mc
          image: {{ include "minio.mcImage" . }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/setup.sh"]
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          envFrom:
            - secretRef:
                name: {{ .Values.rootSecret }}
            - secretRef:
                name: {{ .Values.usersSecret }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: policies
              mountPath: /policies
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: scripts
          configMap:
            name: minio-setup
            items:
              - key: setup.sh
                path: setup.sh
        - name: policies
          configMap:
            name: minio-setup

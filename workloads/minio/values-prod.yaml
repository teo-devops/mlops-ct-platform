# prod profile (bare-metal) — ILLUSTRATIVE, not applied by gitops/environments/demo.
# In production the artifact-store contract is fulfilled by a replicated MinIO
# (erasure coding, TLS behind nginx as in teo-devops/minIO-docker) on Longhorn
# volumes, or by S3 in the aws profile. Same buckets, users and policies.
persistence:
  size: 500Gi
  storageClassName: longhorn
resources:
  requests: {cpu: "1", memory: 4Gi}
  limits: {memory: 8Gi}
ingress:
  enabled: true
  consoleHost: minio.example.internal
networkPolicy:
  hostCidr: 10.0.0.0/8
